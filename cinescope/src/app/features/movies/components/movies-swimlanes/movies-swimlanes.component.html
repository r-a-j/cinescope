<div class="movies-swimlanes-stack">
  <!-- Short & Sweet (< 95 Mins) -->
  @if (shortAndSweetSwimlane().length > 0) {
    <div class="lane-wrap">
      <app-swimlane
        title="⏱️ SHORT & SWEET (< 95 MINS)"
        [items]="shortAndSweetSwimlane()"
      ></app-swimlane>
    </div>
  }

  <!-- Critically Acclaimed (★ >= 8.0) -->
  @if (acclaimedSwimlane().length > 0) {
    <div class="lane-wrap">
      <app-swimlane
        title="🌟 CRITICALLY ACCLAIMED (★ 8.0+)"
        [items]="acclaimedSwimlane()"
      ></app-swimlane>
    </div>
  }

  <!-- All Watchlist Movies -->
  @if (allWatchlistSwimlane().length > 0) {
    <div class="lane-wrap last-lane">
      <app-swimlane
        title="🍿 ALL MOVIES IN YOUR WATCHLIST"
        [items]="allWatchlistSwimlane()"
      ></app-swimlane>
    </div>
  }
</div>
