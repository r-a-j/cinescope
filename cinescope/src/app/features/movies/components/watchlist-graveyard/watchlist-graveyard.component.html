@if (graveyardMovies().length > 0) {
  <section class="graveyard-section">
    <div class="lane-header">
      <div class="lane-title-group">
        <span class="graveyard-icon">⚰️</span>
        <div>
          <h3>THE WATCHLIST GRAVEYARD</h3>
          <p class="lane-subtext">Sitting unwatched for over 90 days. Watch it tonight or set it free!</p>
        </div>
      </div>
    </div>

    <div class="graveyard-cards-col">
      @for (gMovie of graveyardMovies(); track gMovie.id) {
        <div class="graveyard-card">
          <button
            type="button"
            class="poster-btn"
            (click)="openDetail.emit(gMovie.tmdbId)"
            [attr.aria-label]="getTitle(gMovie)"
          >
            <img
              [src]="getPoster(gMovie)"
              [alt]="getTitle(gMovie)"
              class="graveyard-poster"
            />
          </button>

          <div class="graveyard-info">
            <button
              type="button"
              class="title-btn"
              (click)="openDetail.emit(gMovie.tmdbId)"
            >
              <h4>{{ getTitle(gMovie) }}</h4>
            </button>

            <div class="graveyard-meta">
              <span class="added-badge">{{ getTimeAgo(gMovie.addedAt) }}</span>
              @if (getRating(gMovie); as r) {
                <span class="meta-dot">•</span>
                <span class="meta-rating">★ {{ r }}</span>
              }
            </div>

            <div class="graveyard-actions">
              <button
                type="button"
                class="grave-btn grave-tonight"
                (click)="watchTonight.emit(gMovie)"
                title="Watch Tonight"
              >
                <ion-icon name="play-outline"></ion-icon>
                <span>Tonight</span>
              </button>

              <button
                type="button"
                class="grave-btn grave-purge"
                (click)="letItGo.emit(gMovie)"
                title="Remove from Watchlist"
              >
                <ion-icon name="trash-outline"></ion-icon>
                <span>Let It Go</span>
              </button>

              <button
                type="button"
                class="grave-btn grave-snooze"
                (click)="snooze.emit(gMovie)"
                title="Snooze for 30 Days"
              >
                <ion-icon name="alarm-outline"></ion-icon>
                <span>Snooze 30d</span>
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </section>
}
