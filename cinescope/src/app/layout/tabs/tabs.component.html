<ion-tabs>
    <ion-tab-bar slot="bottom">

        <ion-tab-button tab="movies" href="/tabs/movies" data-tour="tab-movies">
            <ion-icon name="film"></ion-icon>
            <ion-label>MOVIES</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="tv" href="/tabs/tv" data-tour="tab-tv">
            <ion-icon name="tv"></ion-icon>
            <ion-label>TV</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="discover" href="/tabs/discover" data-tour="tab-discover">
            <ion-icon name="flame"></ion-icon>
            <ion-label>DISCOVER</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="archive" href="/tabs/archive" data-tour="tab-archive">
            <ion-icon name="hourglass"></ion-icon>
            <ion-label>ARCHIVE</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="inbox" href="/tabs/inbox" data-tour="tab-inbox">
            <ion-icon name="mail"></ion-icon>
            <ion-label>INBOX</ion-label>
            @if (storage.inboxCount() > 0) {
                <ion-badge color="danger">{{ storage.inboxCount() }}</ion-badge>
            }
        </ion-tab-button>

    </ion-tab-bar>
</ion-tabs>
