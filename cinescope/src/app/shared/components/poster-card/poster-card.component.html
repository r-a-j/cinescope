<div class="poster-container surface-card" [class.shimmer-active]="!isLoaded()" (click)="onCardClick()" (keyup.enter)="onCardClick()" tabindex="0">

    @if (!isLoaded()) {
        <div class="poster-shimmer" aria-hidden="true">
            <span class="poster-shimmer-title">{{ title() }}</span>
        </div>
    }

    <img
        [src]="resolvedImageUrl()"
        [alt]="title() || 'Movie Poster'"
        width="200"
        height="300"
        [attr.loading]="priority() || isCached() ? 'eager' : 'lazy'"
        [attr.fetchpriority]="priority() ? 'high' : 'auto'"
        [attr.decoding]="isCached() || priority() ? 'sync' : 'async'"
        class="poster-image"
        [class.is-loaded]="isLoaded()"
        [class.is-cached]="isCached()"
        (load)="handleImageLoad($event)"
        (error)="handleImageError($event)" />

    @if (showBookmark()) {
    <button class="bookmark-btn" type="button" aria-label="Toggle Bookmark" (click)="onBookmarkClick($event)">

        @switch (bookmarkState()) {
        @case ('none') {
        <img src="assets/bookmarks/bookmark-empty.svg" alt="Add to Watchlist" class="custom-icon" />
        }
        @case ('watchlist') {
        <img src="assets/bookmarks/bookmark-watchlist.svg" alt="In Watchlist" class="custom-icon" />
        }
        @case ('watched') {
        <img src="assets/bookmarks/bookmark-watched.svg" alt="Watched" class="custom-icon" />
        }
        }

    </button>
    }

</div>
