<div class="swimlane-header">
    <h2 class="swimlane-title">{{ title() }}</h2>
    @if (items().length > 0) {
    <button type="button" class="swimlane-action" aria-label="View All" (click)="openViewAll()">
        ALL ({{ items().length }})
    </button>
    }
</div>

<div class="swimlane-scroll-container">
    <div class="scroll-spacer"></div>

    @for (item of items(); track item.id; let idx = $index) {
    <div class="swimlane-item">
        <app-poster-card
            [title]="item.title"
            [imageUrl]="item.posterUrl || 'assets/placeholders/placeholder.webp'"
            [priority]="idx < 4"
            [showBookmark]="item.mediaType !== 'person'"
            [bookmarkState]="getItemBookmarkState(item)"
            (cardClick)="onCardClick(item)"
            (bookmarkToggle)="onToggleBookmark(item)">
        </app-poster-card>
        @if (item.mediaType === 'person' || item.subtitle) {
        <div class="swimlane-item-caption" tabindex="0" (click)="onCardClick(item)" (keyup.enter)="onCardClick(item)">
            <div class="swimlane-item-name">{{ item.title }}</div>
            @if (item.subtitle) {
            <div class="swimlane-item-sub">{{ item.mediaType === 'person' ? 'Known for: ' + item.subtitle : item.subtitle }}</div>
            }
        </div>
        }
    </div>
    }

    <div class="scroll-spacer"></div>
</div>
